<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workly | Departamentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="app-page">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="./index.html"><span class="brand-mark">W</span><span>Workly</span></a>
      <nav class="main-nav" aria-label="Navegación principal">
        <p class="nav-caption">Espacio de trabajo</p>
        <a class="nav-link" href="./index.html" data-permission="dashboard"><span class="nav-icon">⌂</span> Resumen</a>
        <a class="nav-link" href="./empleados.html" data-permission="empleados:ver"><span class="nav-icon">♙</span> Empleados</a>
        <a class="nav-link active" href="./departamentos.html" data-permission="departamentos:ver"><span class="nav-icon">◇</span> Departamentos</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card">
          <div class="avatar" data-user-initial>U</div>
          <div class="user-meta"><strong data-username>Usuario</strong><span data-role>Rol</span></div>
          <button class="icon-button" type="button" data-logout aria-label="Cerrar sesión">↗</button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar list-topbar">
        <button class="menu-button" id="menuButton" type="button" aria-label="Abrir menú">☰</button>
        <div><p class="eyebrow">Organización</p><h1>Departamentos</h1></div>
        <button class="primary-button" id="newDepartmentButton" type="button" data-permission="departamentos:crear">＋ Nuevo departamento</button>
      </header>

      <section class="panel table-panel">
        <div class="table-toolbar">
          <div><h2>Áreas de la empresa</h2><p id="departmentSummary">Cargando departamentos…</p></div>
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="departmentSearch" type="search" placeholder="Buscar departamento…"></label>
        </div>
        <div class="department-grid" id="departmentGrid"></div>
        <div class="empty-state" id="departmentEmpty" hidden><span>◇</span><h3>No hay departamentos para mostrar</h3><p>Prueba con otra búsqueda o crea un área.</p></div>
      </section>
    </main>
  </div>

  <dialog class="modal" id="departmentModal">
    <form id="departmentForm" method="dialog" novalidate>
      <input type="hidden" id="departmentId" name="id">
      <div class="modal-header">
        <div><p class="eyebrow" id="departmentModalEyebrow">Nuevo registro</p><h2 id="departmentModalTitle">Agregar departamento</h2></div>
        <button class="close-button" type="button" data-close-modal aria-label="Cerrar">×</button>
      </div>
      <div class="form-grid">
        <div class="form-field full"><label for="nombreDepto">Nombre del departamento</label><input id="nombreDepto" name="nombreDepto" required minlength="5" maxlength="50"></div>
        <div class="form-field"><label for="abreviatura">Abreviatura</label><input id="abreviatura" name="abreviatura" maxlength="5" placeholder="Ej. RRHH"></div>
        <div class="form-field"><label for="ubicacion">Ubicación</label><input id="ubicacion" name="ubicacion" maxlength="100" placeholder="Ej. Edificio A"></div>
      </div>
      <div class="modal-actions"><button class="secondary-button" type="button" data-close-modal>Cancelar</button><button class="primary-button" id="saveDepartmentButton" type="submit">Guardar departamento</button></div>
    </form>
  </dialog>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>
  <script type="module" src="./js/controllers/departamentosController.js"></script>
</body>
</html>
